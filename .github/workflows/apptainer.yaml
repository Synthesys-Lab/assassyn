on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  ASSASSYN_APPTAINER: apptainer exec --no-home --bind ${{ github.workspace }}:/workspace assassyn-${{ github.ref_name }}.sif

name: Test (Apptainer)

jobs:
  test:
    name: Test (Apptainer)
    runs-on: self-hosted
    env:
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Restore Base Container Cache
        id: cache-base-container
        uses: actions/cache@v4
        with:
          path: |
            vm/apptainer/assassyn-base.sif
          key: ${{ runner.os }}-apptainer-base-container-${{ hashFiles('vm/apptainer/assassyn-base.def') }}
          restore-keys: |
            ${{ runner.os }}-apptainer-base-container-

      - name: Build Base Container
        if: steps.cache-base-container.outputs.cache-hit != 'true'
        run: |
          echo "Base container cache miss, building base container"
          make build-apptainer-base

      - name: Build Branch Container
        run: |
          echo "Building branch container for ${{ env.BRANCH_NAME }}"
          make build-apptainer-branch APPTAINER_BRANCH=${{ env.BRANCH_NAME }} APPTAINER_REPO=https://github.com/Synthesys-Lab/assassyn.git

      - name: Run Container Tests
        run: |
          cd vm/apptainer
          apptainer test assassyn-${{ env.BRANCH_NAME }}.sif

      - name: Cleanup Containers
        if: always()
        run: |
          echo "Cleaning up branch-specific container"
          rm -f vm/apptainer/assassyn-${{ env.BRANCH_NAME }}.sif
          echo "Cleaned up branch container"
