on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  ASSASSYN_APPTAINER: apptainer exec --no-home --bind ${{ github.workspace }}:/workspace assassyn-${{ github.ref_name }}.sif

name: Test (Apptainer)

jobs:
  test:
    name: Test (Apptainer)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Restore Base Container Cache
        id: cache-base-container
        uses: actions/cache@v4
        with:
          path: |
            vm/apptainer/assassyn-base.sif
          key: ${{ runner.os }}-apptainer-base-container-${{ hashFiles('vm/apptainer/assassyn-base.def') }}
          restore-keys: |
            ${{ runner.os }}-apptainer-base-container-

      - name: Build Base Container
        if: steps.cache-base-container.outputs.cache-hit != 'true'
        run: |
          echo "Base container cache miss, building base container"
          cd vm/apptainer
          apptainer build assassyn-base.sif assassyn-base.def

      - name: Build Branch Container
        run: |
          echo "Building branch container for ${{ github.ref_name }}"
          cd vm/apptainer
          apptainer build --build-arg ASSASSYN_BRANCH=${{ github.ref_name }} assassyn-${{ github.ref_name }}.sif assassyn-branch.def

      - name: Run Container Tests
        run: |
          cd vm/apptainer
          apptainer test assassyn-${{ github.ref_name }}.sif

      - name: Cleanup Containers
        if: always()
        run: |
          cd vm/apptainer
          # Clean up branch-specific container
          rm -f assassyn-${{ github.ref_name }}.sif
          echo "Cleaned up branch container"
